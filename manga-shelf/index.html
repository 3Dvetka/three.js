<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полка манги</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter+Tight:wght@500;700;800&display=swap">
<style>
/* Layout: wine-red rounded "wall" on near-black, section header with count + chevron, 3D-tilting cover cards in a grid (2 cols phone, 4 cols wide); click opens a detail sheet. Single dark look, as in the source video. */
:root {
  --ground: #0e0e14;
  --wall: #5a2a2e;
  --wall-hi: #6b3338;
  --sheet: #23161a;
  --ink: #ffffff;
  --ink-dim: rgba(255,255,255,.62);
  --line: rgba(255,255,255,.14);
  --shadow: rgba(8,4,6,.55);
  --font-cover: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --font-ui: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.23,1,.32,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body {
  font-family: var(--font-ui);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.wall {
  max-width: 980px;
  margin: 0 auto;
  background: radial-gradient(120% 80% at 30% 0%, var(--wall-hi), var(--wall) 60%);
  border-radius: 28px;
  padding: 22px clamp(14px, 3vw, 32px) 30px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 30px 60px -20px #000;
}
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 4px 22px; }
.section-head h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); font-weight: 800; letter-spacing: -.01em; }
.section-head .count { font-size: clamp(15px, 3.4vw, 19px); font-weight: 700; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.section-head .chev { font-size: 20px; font-weight: 700; color: var(--ink-dim); }

.shelf {
  list-style: none; margin: 0; padding: 0;
  display: grid; gap: clamp(16px, 3.5vw, 30px);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  perspective: 900px;
}
@media (max-width: 720px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { min-width: 0; display: block; }

.card {
  --rx: 0deg; --ry: 0deg; --lift: 0px; --gx: 50%; --gy: 50%; --glare: 0;
  position: relative; display: block; width: 100%;
  aspect-ratio: 2 / 3; max-width: 100%;
  padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left;
  transform-style: preserve-3d;
  transform: translateZ(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry));
  transition: transform .45s var(--ease);
  cursor: pointer;
  border-radius: 6px 10px 10px 6px;
  outline: none;
}
.card.is-active { transition: transform .08s linear; }
.card:focus-visible .cover { box-shadow: 0 0 0 3px var(--ink), 0 18px 30px -10px var(--shadow); }
.card::after {
  content: ""; position: absolute; left: 8%; right: 8%; bottom: -14px; height: 20px;
  background: radial-gradient(closest-side, rgba(0,0,0,.55), transparent);
  transform: translateZ(-30px); filter: blur(2px);
  opacity: calc(.7 - var(--glare) * .25); transition: opacity .3s;
}
.cover {
  position: absolute; inset: 0; overflow: hidden;
  border-radius: 6px 10px 10px 6px;
  box-shadow: 0 18px 30px -12px var(--shadow), 0 2px 4px rgba(0,0,0,.3);
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 11% 10% 9% 14%;
  isolation: isolate;
  container-type: inline-size;
}
.cover::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 7%;
  background: linear-gradient(90deg, rgba(0,0,0,.35), rgba(255,255,255,.12) 55%, rgba(0,0,0,.18));
  z-index: 3;
}
.cover::after {
  content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(60% 50% at var(--gx, 50%) var(--gy, 30%), rgba(255,255,255,.38), transparent 70%),
              linear-gradient(115deg, transparent 40%, rgba(255,255,255,.10) 50%, transparent 60%);
  opacity: calc(.25 + var(--glare, 0) * .75);
  mix-blend-mode: soft-light; transition: opacity .3s;
}
.cover .jp { font-family: var(--font-cover); font-size: 8cqi; letter-spacing: .08em; opacity: .85; position: relative; z-index: 2; }
.cover .title {
  font-family: var(--font-cover); line-height: .92; letter-spacing: -.01em;
  font-size: 17cqi; text-wrap: balance; position: relative; z-index: 2; word-break: break-word;
}
.cover .meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px; position: relative; z-index: 2; }
.cover .author { font-size: 6.2cqi; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.cover .vol { font-family: var(--font-cover); font-size: 13cqi; line-height: 1; }
.cover .art { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; }

.rating {
  display: inline-flex; align-items: center; gap: 3px;
  background: rgba(14,14,20,.82); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 999px; padding: 5px 9px 5px 7px;
  font-weight: 800; font-size: clamp(12px, 2.6vw, 15px); font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 14px -4px rgba(0,0,0,.6);
}
.card .rating { position: absolute; top: -10px; right: -10px; z-index: 5; transform: translateZ(40px); }
.rating svg { width: 1em; height: 1em; fill: var(--ink); }
.caption { display: block; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--ink-dim); padding-left: 2px; }

.foot { max-width: 980px; margin: 18px auto 0; color: var(--ink-dim); font-size: 12.5px; line-height: 1.5; padding: 0 6px; }

/* Detail sheet */
dialog.sheet {
  width: min(720px, calc(100% - 32px)); max-height: calc(100% - 32px);
  padding: 0; border: 1px solid var(--line); border-radius: 22px;
  background: var(--sheet); color: var(--ink);
  box-shadow: 0 40px 80px -20px #000;
  overflow: auto;
  opacity: 0; transform: translateY(12px) scale(.96);
  transition: opacity .14s ease-out, transform .14s ease-out, overlay .14s allow-discrete, display .14s allow-discrete;
}
dialog.sheet[open] { opacity: 1; transform: none; transition-duration: .22s; transition-timing-function: var(--ease); }
@starting-style { dialog.sheet[open] { opacity: 0; transform: translateY(12px) scale(.96); } }
dialog.sheet::backdrop { background: rgba(6,4,6,.7); backdrop-filter: blur(4px); }
.sheet-body {
  display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 26px;
  padding: 26px;
}
@media (max-width: 560px) {
  .sheet-body { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 20px; }
  .sheet-cover { width: 56%; justify-self: center; }
}
.sheet-cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; }
.sheet-cover .cover { --glare: .4; }
.sheet-text { min-width: 0; }
.sheet-text .jp { margin: 0; font-family: var(--font-cover); font-size: 13px; letter-spacing: .1em; color: var(--ink-dim); }
.sheet-text h2 { margin: 6px 0 2px; font-family: var(--font-cover); font-weight: 400; font-size: clamp(28px, 6vw, 40px); line-height: 1; text-wrap: balance; }
.sheet-text .ru { margin: 0 0 14px; color: var(--ink-dim); font-weight: 700; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 16px 0; padding: 14px 0; border-block: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--ink-dim); }
.facts dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.desc { margin: 0; line-height: 1.6; font-size: 15.5px; max-width: 62ch; }
.close {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(14,14,20,.6); color: var(--ink);
  font-size: 20px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.close:hover { background: rgba(255,255,255,.12); }
.close:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Per-series covers (original typographic designs, not publisher art) */
.c-onepiece { background: linear-gradient(170deg, #f6c445 0 34%, #e2402f 34% 36%, #1c6fb8 36% 100%); color: #10161f; }
.c-onepiece .title { color: #fff; text-shadow: 3px 3px 0 #b3261b, -1px -1px 0 #10161f; }
.c-onepiece .meta { color: #fff; }
.c-bleach { background: #f2f2ef; color: #111; }
.c-bleach .vol { color: #e8622a; }
.c-drstone { background: linear-gradient(160deg, #2e7d4f, #164a33 70%); color: #eaf5ec; }
.c-drstone .title { color: #d9f2b5; text-shadow: 0 2px 0 #0d2a1d; }
.c-naruto { background: linear-gradient(165deg, #f28a1e 0 58%, #1c3f8f 58% 100%); color: #fff; }
.c-naruto .title { text-shadow: 3px 3px 0 #1c3f8f; }

@media (prefers-reduced-motion: reduce) {
  .card, .card.is-active { transition: none; transform: none !important; }
  dialog.sheet, dialog.sheet[open] { transition: none; transform: none; }
}
</style>
</head>
<body>

<main class="wall" aria-labelledby="sec-title">
  <div class="section-head">
    <h1 id="sec-title">manga</h1><span class="count" id="count">4</span><span class="chev" aria-hidden="true">&gt;</span>
  </div>
  <ul class="shelf" id="shelf"></ul>
</main>
<p class="foot">Обложки нарисованы стилизованно, без официальных артов издателей. Оценки — пример по 10-балльной шкале, как в видео. Наведи курсор на карточку, нажми, чтобы открыть описание.</p>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <button class="close" id="sheet-close" type="button" aria-label="Закрыть">×</button>
  <div class="sheet-body">
    <div class="sheet-cover" id="sheet-cover"></div>
    <div class="sheet-text">
      <p class="jp" id="sheet-jp"></p>
      <h2 id="sheet-title"></h2>
      <p class="ru" id="sheet-ru"></p>
      <span class="rating" id="sheet-rating"></span>
      <dl class="facts" id="sheet-facts"></dl>
      <p class="desc" id="sheet-desc"></p>
    </div>
  </div>
</dialog>

<script>
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6L2.5 9.5l6.6-.8z"/></svg>';

// Edit this list to add manga. `rating` is out of 10.
const MANGA = [
  {
    id: "onepiece", title: "One Piece", ru: "Ван-Пис", jp: "ワンピース", author: "Eiichiro Oda",
    authorRu: "Эйитиро Ода", years: "с 1997", volumes: "больше 110", status: "выходит",
    genre: "приключения, сёнэн", rating: 9.5,
    desc: "Монки Д. Луффи съел дьявольский плод Гому-Гому, и его тело стало растягиваться как резина. Он собирает команду Соломенной Шляпы и плывёт по Гранд Лайн за легендарным сокровищем Ван-Пис, чтобы стать Королём пиратов.",
  },
  {
    id: "bleach", title: "Bleach", ru: "Блич", jp: "ブリーチ", author: "Tite Kubo",
    authorRu: "Тайто Кубо", years: "2001–2016", volumes: "74", status: "завершена",
    genre: "экшен, сверхъестественное, сёнэн", rating: 8.5,
    desc: "Старшеклассник Ичиго Куросаки с детства видит призраков. После встречи с синигами Рукией Кучики он получает силу проводника душ и начинает защищать живых от пустых — злых духов, пожирающих души.",
  },
  {
    id: "drstone", title: "Dr. Stone", ru: "Доктор Стоун", jp: "ドクターストーン", author: "Inagaki · Boichi",
    authorRu: "Рихиро Инагаки (сюжет), Boichi (рисунок)", years: "2017–2022", volumes: "26", status: "завершена",
    genre: "научная фантастика, приключения, сёнэн", rating: 8,
    desc: "Загадочная вспышка превратила всё человечество в камень. Через 3700 лет гениальный школьник Сэнку Исигами пробуждается и решает отстроить цивилизацию с нуля — шаг за шагом, от мыла и стекла до радио, силой одной только науки.",
  },
  {
    id: "naruto", title: "Naruto", ru: "Наруто", jp: "ナルト", author: "Masashi Kishimoto",
    authorRu: "Масаси Кисимото", years: "1999–2014", volumes: "72", status: "завершена",
    genre: "экшен, приключения, сёнэн", rating: 9,
    desc: "В юного ниндзя Наруто Узумаки запечатан Девятихвостый лис, и деревня Листа его сторонится. Наруто мечтает стать Хокаге — главой деревни. Вместе с Саскэ и Сакурой под началом Какаси он учится, сражается и ищет признания.",
  },
];

const ART = {
  onepiece: '<svg class="art" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120 Q25 112 50 120 T100 120 V150 H0z" fill="#ffffff" opacity=".18"/><path d="M0 132 Q25 124 50 132 T100 132 V150 H0z" fill="#0d3f6e" opacity=".5"/></svg>',
  bleach:   '<svg class="art" viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true"><path d="M78 0 L60 150 H64 L84 0z" fill="#111"/><path d="M0 104 L100 92 V96 L0 108z" fill="#e8622a"/></svg>',
  drstone:  '<svg class="art" viewBox="0 0 100 150" aria-hidden="true"><g fill="none" stroke="#d9f2b5" stroke-width=".8" opacity=".35"><path d="M10 30 L30 46 L22 70 L44 88 L36 118"/><path d="M90 20 L70 50 L84 76 L62 104"/></g><circle cx="74" cy="118" r="16" fill="none" stroke="#d9f2b5" stroke-width="1.2" opacity=".5"/><path d="M66 118h16M74 110v16" stroke="#d9f2b5" stroke-width="1.2" opacity=".5"/></svg>',
  naruto:   '<svg class="art" viewBox="0 0 100 150" aria-hidden="true"><g transform="translate(72 112)" fill="none" stroke="#fff" stroke-width="2" opacity=".55"><path d="M0 0 m-2 0 a2 2 0 1 0 4 0 a4 4 0 1 0 -8 0 a6 6 0 1 0 12 0 a8 8 0 1 0 -16 0 a10 10 0 1 0 20 0"/></g></svg>',
};

const fmt = r => Number.isInteger(r) ? String(r) : r.toFixed(1);
const coverHTML = m => `
  <span class="cover c-${m.id}">
    ${ART[m.id] || ""}
    <span class="jp">${m.jp}</span>
    <span class="title">${m.title}</span>
    <span class="meta"><span class="author">${m.author}</span><span class="vol">1</span></span>
  </span>`;

const shelf = document.getElementById("shelf");
document.getElementById("count").textContent = MANGA.length;

for (const m of MANGA) {
  const li = document.createElement("li");
  li.className = "slot";
  li.innerHTML = `
    <button class="card" type="button" data-id="${m.id}" aria-haspopup="dialog" aria-label="${m.title} (${m.ru}), оценка ${fmt(m.rating)} из 10. Открыть описание">
      ${coverHTML(m)}
      <span class="rating">${fmt(m.rating)}${STAR}</span>
    </button>
    <span class="caption">${m.ru}</span>`;
  shelf.appendChild(li);
}

// Tilt
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MAX = 16;
function tilt(card, x, y) {
  const r = card.getBoundingClientRect();
  const px = Math.min(1, Math.max(0, (x - r.left) / r.width));
  const py = Math.min(1, Math.max(0, (y - r.top) / r.height));
  card.style.setProperty("--ry", ((px - .5) * 2 * MAX).toFixed(2) + "deg");
  card.style.setProperty("--rx", ((.5 - py) * 2 * MAX).toFixed(2) + "deg");
  card.style.setProperty("--gx", (px * 100).toFixed(1) + "%");
  card.style.setProperty("--gy", (py * 100).toFixed(1) + "%");
  card.style.setProperty("--lift", "40px");
  card.style.setProperty("--glare", "1");
}
function rest(card) {
  card.classList.remove("is-active");
  for (const [k, v] of [["--rx","0deg"],["--ry","0deg"],["--lift","0px"],["--glare","0"],["--gx","50%"],["--gy","50%"]]) card.style.setProperty(k, v);
}

const cards = shelf.querySelectorAll(".card");
for (const card of cards) {
  if (!reduce) {
    card.addEventListener("pointerenter", () => card.classList.add("is-active"));
    card.addEventListener("pointermove", e => tilt(card, e.clientX, e.clientY));
    card.addEventListener("pointerleave", () => rest(card));
    card.addEventListener("pointercancel", () => rest(card));
    card.addEventListener("focus", () => { if (!card.matches(":hover")) { card.style.setProperty("--lift", "40px"); card.style.setProperty("--rx", "6deg"); card.style.setProperty("--glare", ".6"); } });
    card.addEventListener("blur", () => rest(card));
  }
  card.addEventListener("click", () => openSheet(card.dataset.id, card));
}

// Detail sheet
const sheet = document.getElementById("sheet");
let opener = null;
function openSheet(id, from) {
  const m = MANGA.find(x => x.id === id);
  if (!m) return;
  opener = from;
  document.getElementById("sheet-cover").innerHTML = coverHTML(m);
  document.getElementById("sheet-jp").textContent = m.jp;
  document.getElementById("sheet-title").textContent = m.title;
  document.getElementById("sheet-ru").textContent = m.ru;
  document.getElementById("sheet-rating").innerHTML = `${fmt(m.rating)}${STAR}`;
  document.getElementById("sheet-rating").setAttribute("aria-label", `Оценка ${fmt(m.rating)} из 10`);
  const facts = [["Автор", m.authorRu], ["Годы", m.years], ["Томов", m.volumes], ["Статус", m.status], ["Жанр", m.genre]];
  document.getElementById("sheet-facts").innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  document.getElementById("sheet-desc").textContent = m.desc;
  if (from) rest(from);
  sheet.showModal();
}
document.getElementById("sheet-close").addEventListener("click", () => sheet.close());
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); }); // backdrop
sheet.addEventListener("close", () => { if (opener) opener.focus({ preventScroll: true }); });
</script>
</body>
</html>
